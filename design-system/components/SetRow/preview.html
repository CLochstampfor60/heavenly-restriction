<!-- @dsCard group="Logging" height=330 subtitle="Upcoming, active, done, PR, skipped, stopped" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;padding:16px} .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .col{display:grid;gap:12px;max-width:380px}</style>
</head><body class="hr-root">
<div class="col">
<div class="hr-set hr-set--done"><span class="hr-set__n hr-num">1</span><span class="hr-set__v">140<small>lb</small></span><span class="hr-set__v">10<small>reps</small></span><button class="hr-set__check" aria-label="Set 1 done, undo"><span class="hr-box"><svg class="hr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></div>
<div class="hr-set hr-set--pr"><span class="hr-set__n hr-num">2</span><span class="hr-set__v">145<small>lb</small></span><span class="hr-set__v">9<small>reps</small></span><button class="hr-set__check" aria-label="Set 2 done, personal record, undo"><span class="hr-box"><svg class="hr-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5L5 13.5h6l-1.5 8 9-11.5h-6l1-7.5z"/></svg></span></button></div>
<div class="hr-set hr-set--active"><span class="hr-set__n hr-num">3</span><span class="hr-set__v hr-set__v--faded">140<small>lb</small></span><span class="hr-set__v hr-set__v--faded">9<small>reps</small></span><button class="hr-set__check" aria-label="Log set 3 with last time's values"><span class="hr-box"></span></button></div>
<div class="hr-set"><span class="hr-set__n hr-num">4</span><span class="hr-set__v hr-set__v--faded">140<small>lb</small></span><span class="hr-set__v hr-set__v--faded">8<small>reps</small></span><button class="hr-set__check" aria-label="Log set 4 with last time's values"><span class="hr-box"></span></button></div>
<div class="hr-set hr-set--skipped"><span class="hr-set__n hr-num">5</span><span class="hr-set__v">—</span><span class="hr-set__v">Skipped</span><span></span></div>
<div class="hr-set hr-set--stopped"><span class="hr-set__n hr-num"><svg class="hr-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="8,3 16,3 21,8 21,16 16,21 8,21 3,16 3,8"/></svg></span><span class="hr-set__v">150<small>lb</small></span><span class="hr-set__v" style="color:var(--stop);font-size:18px">Stopped</span><span></span></div>
</div>
</body></html>
