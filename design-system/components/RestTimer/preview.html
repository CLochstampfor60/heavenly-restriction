<!-- @dsCard group="Logging" height=150 subtitle="Starts when a set is checked off" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;padding:16px} .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .col{display:grid;gap:12px;max-width:380px}</style>
</head><body class="hr-root">
<div class="col">
<div class="hr-timer" role="timer" aria-label="Rest 1 minute 12 seconds left">
<svg class="hr-timer__ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="hr-track" cx="16" cy="16" r="13"/><circle class="hr-prog" cx="16" cy="16" r="13" stroke-dasharray="81.7" stroke-dashoffset="16.3"/></svg>
<span class="hr-timer__grow"><span class="hr-timer__time">1:12</span><span class="hr-timer__label">Rest · target 1:30</span></span>
<button class="hr-btn hr-btn--ghost hr-btn--compact" aria-label="Add 15 seconds">+15 s</button><button class="hr-btn hr-btn--ghost hr-btn--compact">Skip</button></div>
<div class="hr-timer hr-timer--done" role="timer"><svg class="hr-timer__ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="hr-prog" cx="16" cy="16" r="13" stroke-dasharray="81.7" stroke-dashoffset="0"/></svg>
<span class="hr-timer__grow"><span class="hr-timer__time">0:00</span><span class="hr-timer__label">Rest done · go</span></span></div>
</div>
</body></html>
