# Install once:  pip install pre-commit && pre-commit install
# Update hooks:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Leak guard: blocks staged lines containing anything in internal_docs/private-strings.txt
  # (gitignored, local only). Skipped with a note when that file does not exist.
  - repo: local
    hooks:
      - id: private-strings
        name: private strings (internal_docs/private-strings.txt)
        entry: python scripts/check_private_strings.py
        language: python
        pass_filenames: false
        always_run: true
