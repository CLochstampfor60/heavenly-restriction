name: dependency-audit

# Known-vulnerability check for Python and npm dependencies. Read-only; no secrets used.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: new advisories surface even without commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend requirements
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
