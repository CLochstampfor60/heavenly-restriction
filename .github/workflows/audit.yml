name: dependency-audit

# Known-vulnerability check for Python and npm dependencies. Read-only; no secrets used.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: new advisories surface even without commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend requirements
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
