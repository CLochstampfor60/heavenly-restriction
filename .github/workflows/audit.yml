name: dependency-audit

# Known-vulnerability check for Python and npm dependencies. Read-only; no secrets used.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: new advisories surface even without commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend requirements
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
